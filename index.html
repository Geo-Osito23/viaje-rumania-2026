function googleDirections(stops){

}

  bar.setAttribute('aria-label', 'Navegación entre días del viaje');
  const prev = document.createElement('button');
  prev.type = 'button'; prev.textContent = '← Día anterior'; prev.disabled = i === 0;
  prev.onclick = () => showDay(i - 1);
  const label = document.createElement('span');
  label.className = 'day-nav-label';
  label.textContent = 'Día ' + (i + 1) + ' de ' + DAYS.length + ' · ' + DAYS[i].day + ' noviembre';
  const next = document.createElement('button');
  next.type = 'button'; next.textContent = 'Día siguiente →'; next.disabled = i === DAYS.length - 1;
  next.onclick = () => showDay(i + 1);
  const index = document.createElement('button');
  index.type = 'button'; index.className = 'day-index-button';
  index.textContent = '⌂ Volver al índice'; index.onclick = () => showHome();
  bar.append(prev, label, next, index);
  main.prepend(bar);
};

<script>
const AUDIO_GUIDES={"12":["El zoológico de Târgoviște es uno de los más antiguos de Rumanía. Sus orígenes se relacionan con la tradición de colecciones de animales de la antigua corte principesca. Hoy es un lugar de paseo familiar y una forma de descubrir distintas especies.","La Torre Chindiei es uno de los símbolos de Târgoviște, antigua capital de Valaquia. Se asocia al reinado de Vlad el Empalador en el siglo quince. Junto a ella se encuentran los restos de la Corte Principesca, desde donde gobernaron distintos príncipes valacos.","El Parque Chindia rodea parte del antiguo conjunto principesco de Târgoviște. Es un espacio para pasear junto a los monumentos que recuerdan la época en que la ciudad fue centro político de Valaquia.","Dâmbovița Mall es un centro comercial contemporáneo de Târgoviște. Más que una visita histórica, es una parada práctica para descansar, comer o comprar después de recorrer el casco antiguo.","Los museos de Târgoviște permiten conocer diferentes etapas de la historia rumana, desde la antigua corte principesca hasta la vida durante el comunismo. La Catedral Metropolitana refleja también la importancia religiosa de la ciudad."],"13":["La fortaleza de Poienari se alza sobre una montaña y está estrechamente vinculada a Vlad el Empalador, príncipe de Valaquia. Su ubicación defensiva domina el valle del río Argeș. La subida es exigente y conviene comprobar si el acceso está abierto.","Desde el valle se aprecia por qué Poienari era una fortaleza estratégica: sus murallas se levantan sobre una ladera abrupta. Aunque a veces se la relaciona con Drácula, su interés principal está en la historia real de Vlad el Empalador.","El monasterio de Curtea de Argeș es uno de los monumentos religiosos más conocidos de Rumanía. Su iglesia del siglo dieciséis destaca por la decoración de piedra y las torres ornamentadas. La leyenda del maestro Manole forma parte de su tradición popular.","Pitești es una ciudad de la región histórica de Valaquia. Uno de sus lugares de memoria más importantes es la antigua prisión, relacionada con la represión política del periodo comunista y con el llamado experimento de Pitești."],"14":["El Palacio del Parlamento de Bucarest fue impulsado durante la dictadura de Nicolae Ceaușescu en los años ochenta. Su construcción transformó profundamente el centro de la ciudad. Hoy alberga instituciones del Estado y es conocido por sus enormes dimensiones.","Lipscani es el corazón del casco antiguo de Bucarest. Sus calles recuerdan el pasado comercial de la ciudad, cuando comerciantes y artesanos de distintos lugares se reunían aquí. Hoy mezcla edificios históricos, cafés y restaurantes.","La iglesia Stavropoleos fue construida en el siglo dieciocho y es una joya de la arquitectura brâncovenesc, un estilo rumano que combina influencias locales, bizantinas y barrocas. Destacan su pórtico tallado y su pequeño patio.","Cărturești Carusel es una librería instalada en un edificio histórico restaurado del casco antiguo. Su interior blanco, con balcones curvos y espacios abiertos, la ha convertido en uno de los lugares más fotografiados de Bucarest.","El pasaje Macca-Vilacrosse es una galería cubierta del siglo diecinueve, reconocible por su techo de cristal amarillento. Recuerda la etapa en que Bucarest incorporaba pasajes comerciales inspirados en otras capitales europeas.","El Ateneo Rumano, inaugurado en el siglo diecinueve, es uno de los grandes símbolos culturales de Bucarest y sede de conciertos. El Museo Nacional de Arte ocupa el antiguo Palacio Real y reúne obras rumanas y europeas."],"15":["El Ateneo Rumano es una sala de conciertos emblemática, famosa por su cúpula y su decoración interior. El cercano parque Cișmigiu es uno de los jardines públicos más antiguos de Bucarest y ofrece un respiro entre las avenidas del centro.","El Museo Nacional de la Aldea reúne casas y construcciones tradicionales trasladadas desde diferentes regiones de Rumanía. Permite conocer cómo era la vida rural. Snagov, por su parte, es conocido por su lago y su monasterio.","Therme București es un complejo termal moderno con piscinas, jardines tropicales y zonas de bienestar. No es un monumento histórico: aquí la idea es descansar después de varios días de visitas.","Este tiempo con la familia es una oportunidad para escuchar historias personales y descubrir costumbres que no aparecen en las guías turísticas. Las comidas y conversaciones también forman parte del viaje."],"16":["El castillo de Bran se hizo famoso por su asociación popular con Drácula, aunque la relación histórica con Vlad el Empalador es limitada. La fortaleza medieval protegía un paso entre Transilvania y Valaquia y más tarde fue residencia de la reina María de Rumanía.","En el mercado cercano al castillo de Bran se venden recuerdos y productos locales, como quesos y dulces. Es una ocasión para conocer sabores de la zona montañosa de Transilvania, aunque los puestos y horarios pueden variar.","Piața Sfatului es la plaza principal de Brașov y fue centro de su vida comercial. Muy cerca se encuentra la Iglesia Negra, un gran templo gótico que recibió su nombre después del incendio que afectó a la ciudad en 1689.","Strada Sforii es conocida por ser una calle especialmente estrecha de Brașov. La cercana Puerta de Catalina conserva el recuerdo de las antiguas fortificaciones y del acceso a la ciudad medieval."],"17":["Sighișoara conserva una de las ciudadelas medievales habitadas más conocidas de Europa. La Torre del Reloj dominaba uno de sus accesos y hoy es su gran símbolo. Pasear por Piața Cetății permite imaginar la vida de los antiguos gremios.","La casa conocida como Casa Vlad Dracul está vinculada por tradición a la familia de Vlad el Empalador. Se encuentra en la ciudadela de Sighișoara, donde nació, según la tradición, el futuro príncipe de Valaquia.","La Escalera Cubierta de Sighișoara fue construida para facilitar el acceso a la escuela y a la iglesia de la colina, especialmente en invierno. Sus escalones de madera forman uno de los rincones más característicos de la ciudadela.","Salina Turda es una antigua explotación de sal transformada en atracción turística. La extracción de sal fue importante durante siglos para la economía de Transilvania. Hoy sus grandes cámaras subterráneas muestran la escala de ese trabajo minero.","Piața Unirii es una de las plazas centrales de Cluj-Napoca. En ella destacan la iglesia de San Miguel y la estatua de Matías Corvino, rey de Hungría nacido en esta ciudad en el siglo quince."],"18":["La plaza Unirii reúne algunos de los monumentos más reconocibles de Cluj-Napoca. La iglesia gótica de San Miguel y el monumento a Matías Corvino recuerdan el pasado medieval y la diversidad histórica de Transilvania.","El palacio Bánffy es un edificio barroco del siglo dieciocho situado en el centro de Cluj. Fue residencia de una importante familia aristocrática y hoy alberga el Museo de Arte.","La plaza Avram Iancu lleva el nombre de una figura destacada de la historia rumana del siglo diecinueve. La catedral ortodoxa, construida en el siglo veinte, domina este espacio urbano.","La Torre de los Sastres formaba parte de las defensas medievales de Cluj. Su nombre recuerda la responsabilidad de los gremios de artesanos en la protección de determinados tramos de muralla.","El Parque Central de Cluj se desarrolló en el siglo diecinueve como lugar de recreo. El lago Chios y sus paseos ofrecen una pausa tranquila cerca del centro urbano.","Cetățuia es una colina que ofrece una panorámica de Cluj-Napoca. En el pasado albergó una fortificación de época habsbúrgica; hoy destaca sobre todo como mirador de la ciudad.","El Jardín Botánico Alexandru Borza es un espacio universitario dedicado al estudio y conservación de plantas. Sus colecciones, invernaderos y jardines temáticos muestran especies de diferentes regiones del mundo.","Cluj cuenta con museos de historia que explican el pasado de Transilvania y espacios de ocio de estética imaginativa, como Steampunk Transylvania. Son visitas de carácter muy diferente, según lo que apetezca al grupo.","Joben y Enigma son locales conocidos por su decoración inspirada en la estética steampunk. Más que monumentos, son opciones para terminar el día con una bebida y un ambiente singular.","Cheile Turzii es una garganta natural excavada en la roca caliza, conocida por sus paredes abruptas y senderos. Es una excursión de naturaleza que requiere tiempo y condiciones adecuadas para caminar."],"19":["El día libre permite disfrutar de la vida cotidiana con la familia, una parte importante del viaje que no necesita una ruta cerrada.","Una excursión corta por los alrededores puede descubrir iglesias, mercados o paisajes locales. La elección dependerá del tiempo disponible y de lo que recomiende la familia."]};
let activeAudioButton=null;
function stopVisitAudio(){if('speechSynthesis' in window)window.speechSynthesis.cancel();if(activeAudioButton){activeAudioButton.textContent='▶ Escuchar historia';activeAudioButton=null;}}
function playVisitAudio(day,index,button){
 if(!('speechSynthesis' in window)){alert('Este navegador no admite lectura de voz. Puedes leer la explicación debajo del botón.');return;}
 const text=AUDIO_GUIDES[day]&&AUDIO_GUIDES[day][index];if(!text)return;
 if(activeAudioButton===button&&window.speechSynthesis.speaking){stopVisitAudio();return;}
 stopVisitAudio();const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=0.93;u.pitch=1;
 u.onend=()=>{if(activeAudioButton===button){button.textContent='▶ Escuchar historia';activeAudioButton=null;}};
 u.onerror=()=>{if(activeAudioButton===button){button.textContent='▶ Escuchar historia';activeAudioButton=null;}};
 activeAudioButton=button;button.textContent='■ Detener audio';window.speechSynthesis.speak(u);
}
const showDayWithAudio=showDay;
showDay=function(i){stopVisitAudio();showDayWithAudio(i);const d=DAYS[i];const entries=document.querySelectorAll('#main .twocol section:first-child .item');entries.forEach((el,j)=>{const narration=AUDIO_GUIDES[d.day]&&AUDIO_GUIDES[d.day][j];if(!narration)return;const wrapper=document.createElement('div');wrapper.className='audio-guide';const btn=document.createElement('button');btn.type='button';btn.className='audio-play';btn.textContent='▶ Escuchar historia';btn.onclick=()=>playVisitAudio(d.day,j,btn);const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Leer explicación';const para=document.createElement('p');para.textContent=narration;detail.append(summary,para);wrapper.append(btn,detail);el.appendChild(wrapper);});};

const AUDIO_LEGENDS={"12":["Se cuenta que en la antigua corte de Târgoviște los gobernantes mantenían animales exóticos como muestra de prestigio. Es una tradición sobre el origen de las colecciones, no una descripción comprobada del zoológico actual.","Una tradición popular vincula la Torre Chindiei con Vlad el Empalador y sus severos castigos. Muchas historias que se cuentan sobre él mezclan episodios históricos con exageraciones transmitidas durante siglos.","El nombre Chindia se relaciona popularmente con la hora de la tarde y antiguas celebraciones. Su origen exacto y las historias que lo rodean tienen distintas versiones.","Este centro comercial es reciente y no tiene una leyenda histórica conocida. La curiosidad está en el contraste: a pocos minutos se pasa de la antigua capital de Valaquia a la ciudad moderna.","Los relatos sobre la época comunista suelen transmitirse en las familias de formas muy distintas. En estos museos merece la pena comparar las memorias personales con los documentos históricos."],"13":["Según la tradición, Vlad el Empalador reforzó Poienari utilizando a nobles obligados a trabajar en la fortaleza. Los detalles de esta historia varían según la fuente y no deben confundirse con una reconstrucción histórica segura.","La fama de Poienari como el verdadero castillo de Drácula nació de su vínculo con Vlad el Empalador. El Drácula vampiro, sin embargo, es un personaje literario creado muchos siglos después.","La leyenda del maestro Manole cuenta que los muros de la iglesia se derrumbaban cada noche. Para terminar la obra, el maestro habría sacrificado a su esposa Ana dentro de los muros. Es una leyenda trágica, no un hecho histórico demostrado.","El llamado experimento de Pitești fue un episodio real de represión y violencia política. Aquí es mejor evitar rumores sensacionalistas y escuchar testimonios documentados de supervivientes."],"14":["Circulan historias sobre túneles secretos y salas ocultas bajo el Palacio del Parlamento. Algunas instalaciones subterráneas existen, pero muchas versiones populares exageran su extensión o finalidad.","En el casco antiguo se dice que ciertos sótanos y pasadizos conectaban antiguos comercios. Son relatos urbanos difíciles de verificar y forman parte del ambiente misterioso de Lipscani.","Una tradición del monasterio destaca la serenidad del patio como refugio frente al ruido de Bucarest. Más que un misterio, es una impresión que visitantes de distintas épocas han compartido.","Se cuenta que el edificio de la librería tuvo distintas vidas antes de su restauración. La curiosidad es ver cómo un antiguo inmueble comercial se transformó en un espacio cultural muy fotografiado.","El pasaje Macca-Vilacrosse conserva un aire de novela: sus galerías cubiertas invitan a imaginar encuentros secretos y tertulias de comerciantes. Son evocaciones del lugar, no sucesos concretos comprobados.","El Ateneo está ligado al lema popular «Dați un leu pentru Ateneu», que recuerda la campaña de donaciones para financiarlo. La frase se ha convertido en parte de su memoria cultural."],"15":["Una curiosidad del parque Cișmigiu es que generaciones de vecinos lo recuerdan como escenario de citas románticas y paseos familiares. No hay una sola leyenda, sino muchas historias cotidianas.","En torno al monasterio de Snagov circula la leyenda de que allí está enterrado Vlad el Empalador. La identificación de su tumba sigue siendo discutida y no está demostrada.","Therme es un complejo moderno, así que no tiene una leyenda medieval propia. Su historia curiosa está en el contraste entre el frío de noviembre y sus piscinas cálidas rodeadas de vegetación tropical.","Las mejores historias de este día quizá sean las de la propia familia: recuerdos de infancia, fiestas y cambios en Rumanía que no aparecen en las guías."],"16":["La leyenda más famosa afirma que Bran es el castillo de Drácula. La asociación se hizo popular por el turismo y la novela de Bram Stoker, pero no existe una prueba sólida de que el castillo inspirara directamente la residencia del vampiro.","En los mercados de montaña se transmiten recetas y consejos de generación en generación. Preguntar por el origen de un queso o un dulce puede revelar una historia familiar distinta en cada puesto.","Después del gran incendio de Brașov de 1689, la iglesia gótica pasó a conocerse como Iglesia Negra. Se cuenta que el humo ennegreció sus muros; el nombre popular quedó como recuerdo del desastre.","Una tradición local cuenta que la estrecha Strada Sforii servía como paso rápido para los bomberos. La explicación es popular, aunque los detalles sobre su uso histórico no siempre están documentados."],"17":["Sighișoara presume de su vínculo con Vlad el Empalador. La tradición sitúa su nacimiento en la ciudadela, aunque algunos detalles de su infancia siguen siendo difíciles de confirmar.","La Casa Vlad Dracul se promociona como el lugar donde nació Vlad el Empalador. La identificación se apoya en la tradición local, y conviene distinguirla de los hechos documentados.","La Escalera Cubierta parece sacada de un cuento. Se dice que protegía a los estudiantes del frío y la nieve durante la subida; esa función práctica es parte esencial de su historia.","La sal era tan valiosa que en muchas regiones se la comparaba con el oro. En Turda, las enormes galerías hacen fácil imaginar la dureza de los trabajos mineros de otras épocas.","Se cuenta que Matías Corvino, nacido en Cluj, fue un rey justo que viajaba disfrazado para conocer la vida de la gente común. Es un motivo frecuente del folclore húngaro, no una crónica verificable de cada aventura."],"18":["Las leyendas sobre Matías Corvino lo presentan a menudo resolviendo injusticias mientras oculta su identidad. Son relatos folclóricos que han viajado por distintas regiones de Europa Central.","Los palacios aristocráticos como el Bánffy suelen inspirar historias de salones secretos y bailes elegantes. No hay que confundir esa imaginación con datos demostrados sobre el edificio.","Avram Iancu aparece en numerosas canciones y relatos populares como defensor de los rumanos de Transilvania. Su figura histórica también ha sido interpretada de formas diferentes.","La torre recuerda una época en que los gremios defendían las murallas. Resulta fácil imaginar a los sastres cambiando las agujas por armas cuando la ciudad se veía amenazada.","Entre los habitantes de Cluj, el Parque Central guarda recuerdos de paseos, conciertos y encuentros. Sus historias más interesantes suelen ser personales, no sobrenaturales.","En la colina Cetățuia hubo una fortificación y también una prisión militar. El mirador actual contrasta con ese pasado mucho menos apacible.","Los jardines botánicos han alimentado muchas historias sobre plantas medicinales y especies exóticas. No todas las propiedades que se les atribuyen en la tradición popular tienen respaldo científico.","El mundo steampunk imagina una historia alternativa dominada por máquinas de vapor y engranajes. Aquí los relatos fantásticos forman parte de la ambientación, no de la historia real de Cluj.","La decoración de estos bares invita a inventar aventuras de exploradores y máquinas imposibles. Es ficción temática, no una leyenda histórica local.","Las gargantas y cuevas de Transilvania han inspirado relatos de escondites y tesoros. En Cheile Turzii conviene disfrutar de esas historias como folclore, sin dar por probados sus detalles."],"19":["Las historias más valiosas pueden surgir en la sobremesa: pregunta a la familia cómo era la vida en el pueblo hace varias décadas.","En las excursiones cercanas, los vecinos pueden conocer leyendas sobre fuentes, iglesias o caminos. Escucharlas es una buena forma de descubrir la tradición oral local."]};
function playNarration(text,button,label){
 if(!('speechSynthesis' in window)){alert('La lectura de voz no está disponible en este navegador. Puedes leer el texto debajo.');return;}
 if(activeAudioButton===button&&speechSynthesis.speaking){stopVisitAudio();return;}
 stopVisitAudio();
 const u=new SpeechSynthesisUtterance(text);u.lang='es-ES';u.rate=0.93;
 activeAudioButton=button;button.textContent='■ Detener audio';
 u.onend=u.onerror=()=>{if(activeAudioButton===button){button.textContent=label;activeAudioButton=null;}};
 speechSynthesis.speak(u);
}
const showDayWithLegends=showDay;
showDay=function(i){
 showDayWithLegends(i);
 const d=DAYS[i],entries=document.querySelectorAll('#main .twocol section:first-child .item');
 entries.forEach((el,j)=>{

  const box=document.createElement('div');box.className='legend-guide';

  details.append(summary,p);box.append(title,btn,details);el.appendChild(box);
 });
};</script>

r disponibilidad."],["Sopa y plato rápido","Elegir según el restaurante disponible junto a la salina."],["Ciorbă, sarmale y platos tradicionales","Cocina rumana casera; comprobar la carta vigente."],["Gulaș de ternera y sarmale","También salchichas caseras y Somlói galuska de postre."]],"18":[["Gulaș de ternera y sarmale","Otra opción: sopa de setas o Somlói galuska."],["Ciorbă y carnes tradicionales","Opciones típicas de Transilvania."],["Ciorbă, șnițel o bocadillo","Parada flexible según hora y disponibilidad."]],"19":[["Comida familiar","Especialidad de casa a decidir."],["Cena familiar","Especialidad de casa a decidir."]],"20":[["Sándwich o ensalada","Oferta del aeropuerto según terminal y horario."],["Bocadillo o comida rápida","Dependerá del vuelo y la hora de llegada."]]};
