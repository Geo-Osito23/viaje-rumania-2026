function googleDirections(stops){
 if(stops.length<2)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(stops[0]||'Romania');
 const parts=stops.map(x=>encodeURIComponent(x));
 const origin=parts.shift(),destination=parts.pop();
 return 'https://www.google.com/maps/dir/?api=1&origin='+origin+'&destination='+destination+'&travelmode=driving'+(parts.length?'&waypoints='+parts.join('%7C'):'');
}
function googleSearch(name){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name)}
function focusOurMap(place){
 const frame=document.getElementById('our-google-map');if(!frame)return;
 frame.src='https://maps.google.com/maps?q='+encodeURIComponent(place)+'&z=12&output=embed';
 document.getElementById('map-current').textContent='📍 '+place;
 document.getElementById('map-open').href=googleSearch(place);
 frame.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function renderGoogleRoutes(){
 const holder=document.getElementById('google-route-list');if(!holder)return;
 const selected=document.getElementById('map-day').value;
 const showAlt=document.getElementById('map-options').checked;
 const showFood=document.getElementById('map-food').checked;
 const showHotels=document.getElementById('map-hotels').checked;
 const indices=selected==='all'?DAYS.map((_,i)=>i):[Number(selected)];
 if(selected!=='all'){const first=(ROUTE_VARIANTS[DAYS[Number(selected)].day]||[])[0];if(first&&first.length>1)focusOurMap(first[first.length-1]);}
 holder.innerHTML=indices.map(i=>{
  const d=DAYS[i],variants=(ROUTE_VARIANTS[d.day]||[]);
  const active=showAlt?variants:variants.slice(0,1);
  const routes=active.map(v=>'<div class="google-route"><div><b>'+esc(v[0])+'</b><p>'+esc(v.slice(1).join(' → '))+'</p><button type="button" class="focus-map" onclick="focusOurMap('+JSON.stringify(v[v.length-1]).replace(/&/g,'&amp;').replace(/\"/g,'&quot;')+')">📍 Ver destino en nuestro mapa</button></div><a href="'+googleDirections(v.slice(1))+'" target="_blank" rel="noopener">🚗 Abrir ruta ↗</a></div>').join('');
  const restaurants=showFood?'<div class="google-mini"><b>🍽 Comer y cenar</b><div class="google-pills">'+d.food.filter(f=>showAlt||!/alternativa/i.test(f.meal||'')).map(f=>'<a target="_blank" rel="noopener" href="'+googleSearch(f.place||f.name)+'">'+esc(f.name)+' · '+esc(f.meal||'')+' ↗</a>').join('')+'</div></div>':'';
  const hotels=(showHotels&&LODGING[d.day])?'<div class="google-mini"><b>🛏 Hoteles · '+esc(LODGING[d.day].city)+'</b><div class="google-pills">'+LODGING[d.day].items.map(h=>'<a target="_blank" rel="noopener" href="'+googleSearch(h[4]||h[0])+'">'+esc(h[0])+' · '+esc(h[2])+' ↗</a>').join('')+'</div></div>':'';
  return '<article class="google-day"><div class="google-dayhead"><h3>'+esc(d.day+' nov. · '+d.title)+'</h3><button type="button" onclick="showDay('+i+')">Ver día ↗</button></div>'+routes+restaurants+hotels+'</article>';
 }).join('');
}

function routeEmbedUrl(stops){
 if(stops.length<2)return 'https://maps.google.com/maps?q='+encodeURIComponent(stops[0]||'Romania')+'&output=embed';
 // Google Maps public directions embed (no API key). Fallback external route is always available.
 return 'https://maps.google.com/maps?output=embed&f=d&saddr='+encodeURIComponent(stops[0])+'&daddr='+encodeURIComponent(stops.slice(1).join(' to:'))+'&dirflg=d';
}
function renderDayRouteMap(i){
 const d=DAYS[i],main=document.getElementById('main');
 if(!main)return;
 const variants=ROUTE_VARIANTS[d.day]||[];
 const section=document.createElement('section');
 section.className='daily-route-section';
 section.innerHTML='<div class="sectionhead"><h2>🗺 Mapa y ruta del día</h2><span class="hint">Google Maps · recorrido en coche</span></div>'
  +'<div class="daily-route-controls"><label for="daily-route-choice">Ruta o alternativa</label><select id="daily-route-choice">'+variants.map((v,j)=>'<option value="'+j+'">'+esc(v[0])+'</option>').join('')+'</select></div>'
  +'<div class="google-embed daily-embed"><iframe id="daily-map-iframe" title="Google Maps: ruta del día '+esc(d.day)+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><div class="google-embed-tools"><span id="daily-map-caption"></span><a id="daily-map-link" target="_blank" rel="noopener">🚗 Abrir ruta completa en Google Maps ↗</a></div></div>'
  +'<div id="daily-map-stops" class="daily-stops"></div>'
  +'<p class="map-help">El mapa integrado depende de que Google permita visualizar la ruta. El botón abre siempre la ruta completa en Google Maps, con sus paradas. Las rutas alternativas no están confirmadas.</p>';
 const tools=main.querySelector('.tools');
 if(tools)tools.insertAdjacentElement('afterend',section);else main.appendChild(section);
 const select=section.querySelector('#daily-route-choice');
 const refresh=()=>{
  const v=variants[Number(select.value)]||[];
  const stops=v.slice(1);
  const frame=section.querySelector('#daily-map-iframe');
  frame.src=routeEmbedUrl(stops);
  section.querySelector('#daily-map-link').href=googleDirections(stops);
  section.querySelector('#daily-map-caption').textContent=v[0]||'Ruta del día';
  section.querySelector('#daily-map-stops').innerHTML=stops.map((stop,j)=>'<a target="_blank" rel="noopener" href="'+googleSearch(stop)+'"><span class="stop-num">'+(j+1)+'</span>'+esc(stop)+' ↗</a>').join('<span class="stop-arrow">→</span>');
 };
 select.addEventListener('change',refresh);
 refresh();
}

// Navegación superior en cada jornada. Se ejecuta tras las extensiones existentes.
const showDayBeforeTopNavigation = showDay;
showDay = function(i) {
  showDayBeforeTopNavigation(i);
  const main = document.getElementById('main');
  if (!main || i < 0 || i >= DAYS.length) return;
  const bar = document.createElement('nav');
  bar.className = 'day-top-nav';
  bar.setAttribute('aria-label', 'Navegación entre días del viaje');
  const prev = document.createElement('button');
  prev.type = 'button'; prev.textContent = '← Día anterior'; prev.disabled = i === 0;
  prev.onclick = () => showDay(i - 1);
  const label = document.createElement('span');
  label.className = 'day-nav-label';
  label.textContent = 'Día ' + (i + 1) + ' de ' + DAYS.length + ' · ' + DAYS[i].day + ' noviembre';
  const next = document.createElement('button');
  next.type = 'button'; next.textContent = 'Día siguiente →'; next.disabled = i === DAYS.length - 1;
  next.onclick = () => showDay(i + 1);
  const index = document.createElement('button');
  index.type = 'button'; index.className = 'day-index-button';
  index.textContent = '⌂ Volver al índice'; index.onclick = () => showHome();
  bar.append(prev, label, next, index);
  main.prepend(bar);
};
